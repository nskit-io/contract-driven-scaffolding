<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background:
      radial-gradient(60% 80% at 10% 100%, rgba(61,220,132,0.16), transparent 55%),
      radial-gradient(50% 60% at 100% 0%, rgba(91,141,239,0.10), transparent 55%),
      #0d1117;
    color: #f0f6fc;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Menlo", monospace; }
  .card {
    width: 100%; height: 100%;
    padding: 74px 76px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  /* hairline frame */
  .card::before {
    content: ""; position: absolute; inset: 26px;
    border: 1px solid rgba(139,148,158,0.14); border-radius: 20px; pointer-events: none;
  }

  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .eyebrow {
    font-size: 21px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #8b949e; display: flex; align-items: center; gap: 14px;
  }
  .eyebrow .dot { color: #3ddc84; }
  .eyebrow b { color: #c9d1d9; font-weight: 600; }

  /* micro-matrix motif, top-right — the product's own output, in its own type */
  .matrix { text-align: right; line-height: 1.55; font-size: 22px; letter-spacing: 0.14em; }
  .matrix .p { color: #ff5470; }   /* ✗ */
  .matrix .g { color: #3ddc84; }   /* ✓ */
  .matrix .tag { color: #3ddc84; font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; }

  .mid { margin-top: -6px; }
  h1 {
    font-size: 78px; font-weight: 800; letter-spacing: -0.022em; line-height: 1.0;
    color: #f0f6fc; text-wrap: balance;
  }
  .thesis {
    margin-top: 30px; font-size: 31px; font-weight: 450; line-height: 1.33;
    color: #adbac7; max-width: 930px;
  }
  .thesis .green { color: #3ddc84; font-weight: 650; }

  .bottom { border-top: 1px solid rgba(139,148,158,0.16); padding-top: 26px; }
  .pipe { font-size: 22px; letter-spacing: 0.01em; color: #768390; white-space: nowrap; }
  .pipe .arw { color: #4b535d; margin: 0 13px; }
  .pipe .green { color: #3ddc84; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="eyebrow"><span class="dot">🩺</span> <b>GITHUB.COM/NSKIT&#8209;IO</b> · OPEN SOURCE</div>
      <div class="matrix mono">
        <div><span class="g">✓</span> <span class="g">✓</span> <span class="p">✗</span> <span class="g">✓</span> <span class="g">✓</span></div>
        <div><span class="g">✓</span> <span class="p">✗</span> <span class="g">✓</span> <span class="g">✓</span> <span class="g">✓</span></div>
        <div><span class="g">✓</span> <span class="g">✓</span> <span class="g">✓</span> <span class="g">✓</span> <span class="g">✓</span> &nbsp;<span class="tag">green</span></div>
      </div>
    </div>

    <div class="mid">
      <h1>Contract&#8209;Driven Scaffolding</h1>
      <div class="thesis">You can't review every line an AI writes.<br>So make each project <span class="green">prove itself&nbsp;green</span> against the bugs you've already been burned by.</div>
    </div>

    <div class="bottom">
      <div class="pipe mono">incident <span class="arw">→</span> contract <span class="arw">→</span> fleet matrix <span class="arw">→</span> fix at source <span class="arw">→</span> <span class="green">green forever</span></div>
    </div>
  </div>
</body>
</html>
